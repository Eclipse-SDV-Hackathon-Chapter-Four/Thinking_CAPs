<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="700px" preserveAspectRatio="none" style="width:612px;height:700px;background:#FFFFFF;" version="1.1" viewBox="0 0 612 700" width="612px" zoomAndPan="magnify"><title>Behaviour &#8212; SerialLink connection state</title><defs/><g><text fill="#000000" font-family="DejaVu Sans" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="501.9072" x="50.7505" y="35.4209">Behaviour &#8212; SerialLink connection state</text><ellipse cx="331" cy="67.6094" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1.0;"/><g id="Waiting"><rect fill="#FFFFFF" height="64.2344" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="144.875" x="258.5" y="138.6094"/><line style="stroke:#000000;stroke-width:1.0;" x1="258.5" x2="403.375" y1="164.9063" y2="164.9063"/><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="53.4502" x="304.2124" y="156.6045">Waiting</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="120.4102" x="263.5" y="181.0449">device path missing</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="124.875" x="263.5" y="195.0137">or cannot be opened</text></g><g id="Handshake"><rect fill="#FFFFFF" height="50.2656" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:1.0;" width="104.252" x="169" y="279.6094"/><line style="stroke:#000000;stroke-width:1.0;" x1="169" x2="273.252" y1="305.9063" y2="305.9063"/><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacing" textLength="78.333" x="181.9595" y="297.6045">Handshake</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="84.252" x="174" y="322.0449">C, V, S&lt;n&gt;, O</text></g><g id="Connected"><rect fill="#FFFFFF" height="64.2344" rx="12.5" ry="12.5"