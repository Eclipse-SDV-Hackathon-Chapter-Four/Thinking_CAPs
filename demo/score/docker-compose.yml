# SPDX-License-Identifier: Apache-2.0
# Two S-CORE nodes on their own network, so SOME/IP really crosses a network:
#   sdv-vehicle     172.28.0.2  vehicle computer: gatewayd + someipd + cruise_bridge
#   sdv-cruise-ecu  172.28.0.3  the other team's ECU: cruise control app (stand-in)
name: sdv-score
networks:
  someip:
    name: sdv-someip
    ipam:
      config:
        - subnet: 172.28.0.0/24
services:
  vehicle:
    platform: linux/amd64
    build: .
    image: sdv-score-runtime:local
    container_name: sdv-vehicle
    hostname: vehicle
    command: ["/opt/node/vehicle.sh"]
    networks:
      someip:
        ipv4_address: 172.28.0.2
    ports:
      - "127.0.0.1:7700:7700"   # cruise_bridge, for the SOVD gateway on the host
    volumes:
      - ./out:/opt/sdv:ro
      - ./node:/opt/node:ro
      - ./run:/run/sdv
    shm_size: 256m
    cap_add: [NET_ADMIN]   # SOME/IP-SD multicast route, see node/*.sh
    init: true
  cruise-ecu:
    platform: linux/amd64
    image: sdv-score-runtime:local
    container_name: sdv-cruise-ecu
    hostname: cruise-ecu
    command: ["/opt/node/cruise_ecu.sh"]
    networks:
      someip:
        ipv4_address: 172.28.0.3
    volumes:
      - ./out:/opt/sdv:ro
      - ./node:/opt/node:ro
      - ./run:/run/sdv
    cap_add: [NET_ADMIN]
    init: true
    depends_on: [vehicle]
