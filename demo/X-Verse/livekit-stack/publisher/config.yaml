# config.yaml
# ------------------------------------------------------------
# CARLA → LiveKit Publisher Configuration
# ------------------------------------------------------------

livekit:
  # LiveKit signaling endpoint
  url: "ws://51.91.98.155:7880"

  # API credentials used by the publisher
  api_key: "devkey"
  api_secret: Este_e_a_nova_exposicao

  # Target LiveKit room
  room: "carla-room"

carla:
  # CARLA server address
  host: "127.0.0.1"
  port: 2000

camera:
  # Image resolution
  width: 960
  height: 540

  # Camera field of view (degrees)
  fov: 70.0

  # Maximum frames per second sent to LiveKit
  fps: 20

  # Camera mounting position (relative to vehicle)
  position:
    x: -4.5
    y: 0.0
    z: 2.4

  # Camera rotation (degrees)
  rotation:
    pitch: -15.0
    yaw: 0.0
    roll: 0.0
