# Single source of the zonal gateway's diagnostic addressing (SWR-052).
# tools/gen_routing.py validates this file (SWR-010) and generates the C++
# routing configuration and the address table used to check the CDA MDD and
# the ECU CAN profiles.

gateway:
  name: zonal_gateway
  logical_address: 0x1010       # DoIP logical address of the gateway's own UDS server
  functional_address: 0xE400    # DoIP target address of the "all zonal ECUs" group
  functional_can_id: 0x7DF      # ISO-TP functional request identifier
  can_tester_address: 0x0E10    # source address the gateway uses on CAN
  tester_range: [0x0E00, 0x0EFF] # DoIP testers allowed to activate routing
  functional_window_ms: 150     # time to collect functional responses
  vin: TCAPSZONALGW00001        # 17 characters, DoIP announcement and DID F190
  ecu_serial: ZGW-POSIX-0001    # DID F18C

routes:
  - name: rear_lighting
    logical_address: 0x1020
    transport: docan
    request_can_id: 0x7E1
    response_can_id: 0x7E9
    p2_ms: 150
    p2_star_ms: 5100
    max_length: 4095
    lost_comm_dtc: 0xC14000     # U0140, illustrative (OP-4)

  - name: front_zone
    logical_address: 0x1030
    transport: docan
    request_can_id: 0x7E2
    response_can_id: 0x7EA
    p2_ms: 150
    p2_star_ms: 5100
    max_length: 4095
    lost_comm_dtc: 0xC14100     # U0141, illustrative (OP-4)
