    text: 'The three parts of a requirement''s unique ID are: (1) a prefix (defined
      in the Metamodel), (2) a structural element (e.g. abbreviation for the feature/subfeature),
      and (3) a keyword (or keywords) describing the content, separated by underscores.'
    citations:
    - evidence_id: E8
      path: docs/contribute/general/naming.rst
