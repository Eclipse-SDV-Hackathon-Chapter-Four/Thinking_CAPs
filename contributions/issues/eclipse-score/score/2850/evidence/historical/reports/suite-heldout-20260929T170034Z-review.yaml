- id: ho-001
  category: onboarding_build
  question: How can a workflow publish to GitHub Pages from a pull request that comes
    from a fork?
  expected_status: answered
  status: answered
  forbidden_hits_automated: []
  facts:
  - fact: Use the pull_request_target event instead of pull_request, because fork
      PR workflows run with minimal permissions and no secrets.
    variants:
    - pull_request_target
    required: true
    judgement: null
  claims:
  - claim_id: a6d432be1abf4600
    kind: documented
    text: When working with GitHub Pages in repositories where contributors submit
      changes via forks, special considerations must be taken due to security restrictions
      imposed by GitHub Actions. This document covers how to safely publish content
      to GitHub Pages from a pull request originating from a fork, based on previous
      research and trial runs on dummy repositories.
    citations:
    - evidence_id: E1
      path: docs/contribute/ci/publishing-gh-pages.rst
      lines:
      - 21
      - 24
      excerpt: When working with GitHub Pages in repositories where contributors submit
        changes via forks, special considerations must be taken due to security restrictions
        imposed by GitHub Actions. This document covers how to safely publish content
        to GitHub Pages from a pull request originating from a fork, based on previous
        research and trial runs on dummy repositories.
    judgement: null
    note: ''
  - claim_id: e9f5d24e7a5bffef
    kind: documented
    text: 'Since pull_request_target runs workflows in the context of the base repository
      rather than the source fork, special considerations must be taken when checking
      out the repository. The following checkout step ensures that the workflow correctly
      fetches the pull request source:'
    citations:
    - evidence_id: E2
      path: docs/contribute/ci/publishing-gh-pages.rst
      lines:
      - 72
      - 74
      excerpt: 'Since pull_request_target runs workflows in the context of the base
        repository rather than the source fork, special considerations must be taken
        when checking out the repository. The following checkout step ensures that
        the workflow correctly fetches the pull request source:'
    judgement: null
    note: ''
  - claim_id: 01d5cde1d2a23ac7
    kind: documented
    text: By default, GitHub Actions run with minimal permissions when triggered by
      a pull_request event from a fork. This means that workflows cannot access repository
      secrets, preventing them from deploying changes to GitHub Pages. To overcome
      this, we can use pull_request_target instead of pull_request. The pull_request_target
      event runs workflows in the context of the base repository rather than the fork,
      allowing access to repository secrets. However, since this introduces potential
      security risks (such as arbitrary code execution with write access), additional
      safeguards must be implemented.
    citations:
    - evidence_id: E3
      path: docs/contribute/ci/publishing-gh-pages.rst
      lines:
      - 29
      - 36
      excerpt: 'By default, GitHub Actions run with minimal permissions when triggered
        by a pull_request event from a fork. This means that workflows cannot access
        repository secrets, preventing them from deploying changes to GitHub Pages.


        To overcome this, we can use pull_request_target instead of pull_request.
        The pull_request_target event runs workflows in the context of the base repository
        rather than the fork, allowing access to repository secrets. However, since
        this introduces potential security risks (such as arbitrary code execution
        with write access), additional safeguards must be implemented.'
    judgement: null
    note: ''
- id: ho-002
  category: onboarding_build
  question: What are feature flags and where are they defined?
  expected_status: answered
  status: answered
  forbidden_hits_automated: []
  facts:
  - fact: Feature flags (toggles) enable or disable features dynamically.
    variants:
    - toggle
    - enable or disable
    required: true
    judgement: null
  - fact: They are defined in Bazel BUILD files (bool_flag / config_setting).
    variants:
    - BUILD
    - bool_flag
    required: true
    judgement: null
  claims:
  - claim_id: 64a17e1aee9881fe
    kind: documented
    text: Feature flags, also known as feature toggles, are a technique used in software
      development to enable or disable features dynamically. The main goal is to allow
      teams to manage and release new features more effectively, enabling A/B testing
      and quickly roll back if issues arise.
    citations:
    - evidence_id: E2
      path: docs/contribute/general/feature_flags.rst
      lines:
      - 26
      - 52
      excerpt: 'Feature flags, also known as feature toggles, are a technique used
        in software development to enable or disable features dynamically. The main
        goal is to allow teams to manage and release new features more effectively,
        enabling A/B testing and quickly roll back if issues arise. This guidance
        aims to define how we intend to make use of these features for configuration
        and variant management of S-CORE.


        There are two categories of flags, build flags and runtime feature toggles:


        Build Flags: These are build/compile time switches used to include or exclude
        certain pieces of code from the build process. When a build flag is set, the
        corresponding code is compiled into the final application/consumer. These
        flags can be used for specific environments, such as build vs. debug. Build
        flags typically require a new full deployment to change the state of the feature.


        Runtime Feature toggles: These toggles control features at runtime, meaning
        they can be changed with partial deployments or ultimately while the application
        is running. They are generally more flexible, allowing for easier experimentation.
        Runtime toggles are typically implemented through configuration settings in
        the'
    judgement: null
    note: ''
  - claim_id: 28d4c75c0b133446
    kind: documented
    text: Feature flags of this category reside in eclipse-score/score:flags.
    citations:
    - evidence_id: E1
      path: docs/contribute/general/feature_flags.rst
      lines:
      - 207
      - 215
      excerpt: 'To modify behavior of a feature, the documentation in the feature
        tree may point out several feature flags. Such flags are of this category.


        The name of the flag is defined as <feature_name>_<configuration> where:


        <feature_name> corresponds to the name of the feature in snake_case


        <configuration> corresponds to the name of the configuration in snake_case


        Feature flags of this category reside in eclipse-score/score:flags.'
    judgement: null
    note: ''
  - claim_id: ef8a18b1a8f92317
    kind: documented
    text: Feature flags of this category reside in a top-level directory called flags
      of the module.
    citations:
    - evidence_id: E3
      path: docs/contribute/general/feature_flags.rst
      lines:
      - 220
      - 229
      excerpt: 'Modules may have configuration options that are implementation specific.
        Such options are not mentioned in the feature tree but inside the documentation
        of the module itself.


        The name of the flag is defined as <feature_name>_<module_name>_<configuration>
        where:


        <feature_name> corresponds to the name of the feature in snake_case


        <module_name> corresponds to the name of the module in snake_case


        <configuration> corresponds to the name of the configuration in snake_case


        Feature flags of this category reside in a top-level directory called flags
        of the module.'
    judgement: null
    note: ''
