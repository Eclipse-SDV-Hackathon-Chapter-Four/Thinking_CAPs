      path: process/process_areas/requirements_engineering/requirements_concept.rst
      lines:
      - 169
      - 201
      excerpt: 'Attribute | Description

        Status | The status for a requirement can either be valid or invalid. The
        reasoning for this is that the goal is to only have valid requirements in
        the main branch. So a status draft is not required. It is obvious that the
        requirement is in the status draft as long as the PR is not merged.

        Unique ID | The unique id consist of a prefix for the requirement type followed
        by a keyword for the feature/component and a short keyword describing its
        content. It is used as a unique identifier for a requirement which can be
        used e.g. for linking the requirements.

        Title | The title of the requirement shall be expressive and rely to the description
        of the requirement.

        Description | In this attribute the content for the requirement will be specified.
        Please be aware that a note in a requirement is not part of the requirement
        itself. This means that notes should only be used to give additional explanation
        or context to the requirement.

        Version | Version of the requirement adapted with each significat change,
        see significant_requirement_changes.

        Rationale / Linkage | In either of those attributes the reasoning for the
        requirement is included. For Stakeholder Requirements a'
