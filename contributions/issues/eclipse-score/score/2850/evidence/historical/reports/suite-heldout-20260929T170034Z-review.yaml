        :links: std_req__aspice_40__iic-17-00[version==1]


        Use the system requirements and the system architecture to identify and document
        the functional and non-functional requirements for the software according
        to defined characteristics for requirements.


        Characteristics of requirements are defined in standards such as ISO IEEE
        29148, ISO 26262-8:2018, or the INCOSE Guide for Writing Requirements.


        Examples for defined characteristics of requirements shared by technical standards
        are verifiability (i.e., verification criteria being inherent in the requirements
        text), unambiguity/comprehensibility, freedom from design and implementation,
        and not contradicting any other requirement.


