- id: ho-008
  category: architecture_interfaces
  question: Why must the communication framework architecture be layered?
  expected_status: answered
  status: answered
  forbidden_hits_automated: []
  facts:
  - fact: To separate the frontend from the underlying communication mechanisms (bindings),
      keeping a stable public API independent of the bindings.
    variants:
    - binding
    - stable public API
    required: true
    judgement: null
  claims:
  - claim_id: ae0a8ac79645e722
    kind: documented
    text: The communication framework architecture must be layered to separate the
      frontend from the underlying communication mechanisms (bindings), ensuring a
      stable public API independent of the underlying binding(s), while enabling flexible
      support for multiple communication protocols.
    citations:
    - evidence_id: E1
      path: docs/features/communication/architecture/index.rst
      lines:
      - 35
      - 37
      excerpt: 'As discussed in com_rationale, the overall architecture of the communication
        framework must be layered. This is required, to separate the frontend from
        the underlying communication mechanisms (also called bindings).


        This ensures a stable public API, independent of the underlying binding(s).
        At the same time, the communication framework can support many different communication
        protocols in a flexible manner.'
    judgement: null
    note: ''
  - claim_id: e83ceef7a2b97526
    kind: documented
    text: The abstraction layer in the communication framework enables different communication
      mechanisms (frontends) and bindings (e.g., IPC, Some/IP), ensuring full testability
      and allowing runtime selection of bindings, thus providing a high-level API
      that focuses on information content rather than low-level binding specifics.
    citations:
    - evidence_id: E2
      path: docs/features/communication/index.rst
      lines:
      - 52
      - 66
      excerpt: 'The Communication Module contains:


        an abstraction layer to enable different communication mechanisms (aka Frontend)


        different bindings which provide the communication functionality (e.g. IPC
        or Some/IP)


        The abstraction layer is designed in a way to ensure full testability for
        an end-user, while enabling runtime selection of the underlying communication
        mechanism with the help of different bindings (e.g. IPC, Some/IP ...).


        It provides the user with a high-level API to focus on the content of information
        – and not on low-level specifics of the used binding. The concept is displayed
        in Figure lola_layers


        Layered architecture with binding-agnostic mw::com and bindings beneath'
    judgement: null
    note: ''
