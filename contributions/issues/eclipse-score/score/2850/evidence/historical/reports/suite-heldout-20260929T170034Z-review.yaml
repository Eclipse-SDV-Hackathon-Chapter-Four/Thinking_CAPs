- id: ho-004
  category: onboarding_build
  question: May Python be used for safety-critical code according to the Python coding
    guidelines?
  expected_status: answered
  status: answered
  forbidden_hits_automated: []
  facts:
  - fact: 'No: Python is not meant for safety-critical systems; the guidelines are
      for tooling, and each tool must be evaluated (TCL).'
    variants:
    - tooling
    - not meant
    required: true
    judgement: null
  claims:
  - claim_id: 6c82e024c91812b0
    kind: documented
    text: Python is not meant to be used directly in safety critical systems.
    citations:
    - evidence_id: E5
      path: docs/contribute/development/python/coding_guidelines.rst
      lines:
      - 28
      - 49
      excerpt: 'Python is not meant to be used directly in safety critical systems.
        The following guidelines are only meant for tooling. Every tool written will
        need to be evaluated for safety criticallity (TCL).


        Consistency within score matters more than personal preference.


        The art lies in balancing completeness of this document vs keeping it short,
        since frankly, no one will read a long document. Let''s focus on issues that
        actively come up in real life and are worth discussing and agreeing upon,
        not on things that might be important.


        We don''t want to write a book here. And we don''t have to, since Python is
        not used for safety critical systems. However, to provide sufficient argumentation
        for code quality when it comes to tool qualification it is necessary to have
        and actively use guidelines.


        This guide is a living document—keep it concise, relevant, and practical.


        We assume basic programming and software-engineering know-how and will not
        repeat basics here! Go ask Google or ChatGPT. Or one of these established
        Python best practice websites:


        PEP 8


        The Hitchhiker''s Guide to Python


        Real Python'
    judgement: null
    note: ''
