      // coverity[autosar_cpp14_m3_2_3_violation]\ntemplate <typename, typename...>\n\
      class ProxyField;\n\n/// \\brief This is the user-visible class of an event\
      \ that is part of a proxy. It contains ProxyEvent functionality that\n/// requires\
      \ knowledge of the SampleType. All type agnostic functionality is stored in\
      \ the base class, ProxyEventBase.\n///\n/// The class itself is a concrete type.\
      \ However, it delegates all actions to an implementation\n/// that is provided\
      \ by the binding the proxy is operating on.\n///\n/// \\tparam SampleDataType\
      \ Type of data that is transferred by the event.\ntemplate <typename SampleDataType>\n\
      class ProxyEvent final : public ProxyEventBase\n{\n    template <typename T>\n\
      \    // Design decission: This friend class provides a view on the internals\
      \ of ProxyEvent.\n    // This enables us to hide unncecessary internals from\
      \ the enduser.\n    // coverity[autosar_cpp14_a11_3_1_violation]\n    friend\
      \ class ProxyEventView;\n\n    // Design decission: ProxyField uses composition\
      \ pattern to reuse code from ProxyEvent. These two classes also have\n    //\
      \ shared private APIs which necessitates the use of the friend keyword.\n  \
      \  // coverity[autosar_cpp14_a11_3_1_violation]\n    template <typename, typename...>\n\
      \    friend class ProxyFieldImpl;\n\n    // Empty struct that is used to make\
      \ the second constructor only accessible to ProxyField (as it is a friend).\n\
      \    struct FieldOnlyConstructorEnabler\n    {\n    };\n\n  public:\n    using\
      \ SampleType = SampleDataType;\n\n    /// Constructor which is dispatched to\
      \ by the other public constructors.\n    ///\n    /// Instantiates the base\
      \ class and members of ProxyEvent. Should only be called directly in tests.\n\
      \    ///\n    /// \\param proxy_binding The binding that shall be associated\
      \ with this proxy.\n    ProxyEvent(const std::string_view event_name, std::unique_ptr<ProxyEventBinding>\
      \ proxy_event_binding);\n\n    /// \\brief Constructor that allows to set the\
      \ binding directly.\n    ///\n    /// This is used by ProxyField to pass in\
      \ a ProxyEventBinding created using the ProxyFieldBindingFactory.\n    ///\n\
      \    /// \\param proxy_binding The binding that shall be associated with this\
      \ proxy.\n    ProxyEvent(ProxyBase& base,\n               const std::string_view\
      \ event_name,\n               Result<std::unique_ptr<ProxyEventBinding>> proxy_event_binding,\n\
      \               FieldOnlyConstructorEnabler);\n\n    /// \\brief Constructs\
      \ a ProxyEvent by querying the base proxie's ProxyBinding for the respective\
      \ ProxyEventBinding.\n    ///\n    /// \\param base Proxy that contains this\
      \ event\n    /// \\param event_name Event name of the event, taken from the\
      \ AUTOSAR model\n    /// \\todo Remove unneeded parameter once we get these\
      \ information from the configuration\n    ProxyEvent(ProxyBase& base, const\
      \ std::string_view event_name);\n\n    /// \\brief A ProxyEvent shall not be\
      \ copyable\n    ProxyEvent(const ProxyEvent&) = delete;\n    ProxyEvent& operator=(const\
      \ ProxyEvent&) & = delete;\n\n    /// \\brief A ProxyEvent shall be movable\n\
      \    ProxyEvent(ProxyEvent&& other) noexcept = default;\n    ProxyEvent& operator=(ProxyEvent&&\
      \ other) noexcept = default;\n\n    ~ProxyEvent() override = default;\n\n  \
      \  /**\n     * \\api\n     * \\brief Receive pending data from the event.\n\
      \     * \\details The user needs to provide a callable that fulfills the following\
      \ signature:\n     *          void F(SamplePtr<const SampleType>) noexcept.\
      \ This callback will be called for each sample\n     *          that is available\
      \ at the time of the call. Notice that the number of callback calls cannot\n\
      \     *          exceed std::min(GetFreeSampleCount(), max_num_samples) times.\n\
      \     * \\tparam F Callable with the signature void(SamplePtr<const SampleType>)\
      \ noexcept\n     * \\param receiver Callable with the appropriate signature.\
      \ GetNewSamples will take ownership\n     *                 of this callable.\n\
      \     * \\param max_num_samples Maximum number of samples to return via the\
      \ given callable.\n     * \\return Number of samples that were handed over to\
      \ the callable or an error.\n     */\n    template <typename F>\n    Result<std::size_t>\
      \ GetNewSamples(F&& receiver, std::size_t max_num_samples) noexcept;\n\n   \
      \ void InjectMock(IProxyEvent<SampleType>& proxy_event_mock)\n    {\n      \
      \  proxy_event_mock_ = &proxy_event_mock;\n        ProxyEventBase::InjectMock(proxy_event_mock);\n\
      \    }\n\n  private:\n    IProxyEvent<SampleType>* proxy_event_mock_;\n\n  \
      \  /// \\brief Indicates whether this event is a field event (i.e. owned by\
      \ a ProxyField, which is a composite of\n    /// method/event) or not.\n};\n\
      \ntemplate <typename SampleType>\nProxyEvent<SampleType>::ProxyEvent(const std::string_view\
      \ event_name,\n                                   std::unique_ptr<ProxyEventBinding>\
      \ proxy_event_binding)\n    : ProxyEventBase{event_name, std::move(proxy_event_binding)},\
      \ proxy_event_mock_{nullptr}\n{\n}\n\ntemplate <typename SampleType>\nProxyEvent<SampleType>::ProxyEvent(ProxyBase&\
      \ base, const std::string_view event_name)\n\n    : ProxyEventBase{event_name,\n\
      \                     ProxyEventBindingFactory<SampleType>::Create(base.GetHandle(),\n\
      \                                                                  ProxyBaseView{base}.GetBinding(),\n\
      \                                                                  event_name,\n\
      \                                                                  ServiceElementType::EVENT)\n\
      \                         .and_then([](std::unique_ptr<ProxyEventBinding> binding)\
      \ {\n                             return Result<std::unique_ptr<ProxyEventBinding>>{std::move(binding)};\n\
      \                         })},\n      proxy_event_mock_{nullptr}\n{\n    ProxyBaseView\
      \ proxy_base_view{base};\n    proxy_base_view.RegisterEvent(event_name, GetReferenceToMoveable());\n\
      \    if (binding_ != nullptr)\n    {\n        const auto& instance_identifier\
      \ = proxy_base_view.GetAssociatedHandleType().GetInstanceIdentifier();\n   \
      \     tracing_data_ = tracing::GenerateProxyTracingStructFromEventConfig(instance_identifier,\
      \ event_name);\n    }\n}\n\ntemplate <typename SampleType>\nProxyEvent<SampleType>::ProxyEvent(ProxyBase&\
      \ base,\n                                   const std::string_view event_name,\n\
      \                                   Result<std::unique_ptr<ProxyEventBinding>>\
      \ proxy_event_binding,\n                                   FieldOnlyConstructorEnabler)\n\
      \    : ProxyEventBase{event_name, std::move(proxy_event_binding)}, proxy_event_mock_{nullptr}\n\
      {\n    // This is the specific ctor that is used by ProxyField for its \"dispatch\
      \ event\" composite. Therefore, we do not\n    // register the event in the\
      \ ProxyBase's event map, since registration in the correct field map is done\
      \ by\n    // ProxyField ctor\n    if (binding_ != nullptr)\n    {\n        ProxyBaseView\
      \ proxy_base_view{base};\n        const auto& instance_identifier = proxy_base_view.GetAssociatedHandleType().GetInstanceIdentifier();\n\
      \        tracing_data_ = tracing::GenerateProxyTracingStructFromFieldConfig(instance_identifier,\
      \ event_name);\n    }\n}\n\ntemplate <typename SampleType>\ntemplate <typename\
      \ F>\nResult<std::size_t> ProxyEvent<SampleType>::GetNewSamples(F&& receiver,\
      \ std::size_t max_num_samples) noexcept\n{\n    if (proxy_event_mock_ != nullptr)\n\
      \    {\n        typename IProxyEvent<SampleType>::Callback mock_callback =\n\
      \            [receiver = std::forward<F>(receiver)](SamplePtr<SampleType> sample_ptr)\
      \ noexcept {\n                receiver(std::move(sample_ptr));\n           \
      \ };\n        return proxy_event_mock_->GetNewSamples(std::move(mock_callback),\
      \ max_num_samples);\n    }\n\n    tracing::TraceGetNewSamples(tracing_data_,\
      \ *binding_);\n\n    auto guard_factory = tracker_->Allocate(max_num_samples);\n\
      \n    if (guard_factory.GetNumAvailableGuards() == 0U)\n    {\n        score::mw::log::LogWarn(\"\
      lola\")\n            << \"Unable to emit new samples, no free sample slots for\
      \ this subscription available.\";\n        return MakeUnexpected(ComErrc::kMaxSamplesReached);\n\
      \    }\n\n    // The tracing_receiver created here always dispatches to the\
      \ user provided receiver. Opposed to the user provided\n    // receiver, which\
      \ gets a typed sample (SamplePtr<SampleType>), it expects to receive type-erased\
      \ sample#+\n    // (SamplePtr<void>). Because this is what the type-erased binding\
      \ layer provides. Before the tracing_receiver\n    // dispatches to the user\
      \ provided receiver, it conditionally traces the received sample and then does\
      \ a \"rebind\"\n    // from the type-erased SamplePtr<void>, the binding provides\
      \ to the typed SamplePtr<SampleType>, the user provided\n    // receiver expects.\n\
      \    auto tracing_receiver =\n        tracing::CreateTracingGetNewSamplesCallback<SampleType,\
      \ F>(tracing_data_, *binding_, std::forward<F>(receiver));\n\n    const auto\
      \ get_new_samples_result = binding_->GetNewSamples(std::move(tracing_receiver),\
      \ guard_factory);\n    if (!get_new_samples_result.has_value())\n    {\n   \
      \     if (get_new_samples_result.error() == ComErrc::kNotSubscribed)\n     \
      \   {\n            return get_new_samples_result;\n        }\n        else\n\
      \        {\n            return MakeUnexpected(ComErrc::kBindingFailure);\n \
      \       }\n    }\n    return get_new_samples_result;\n}\n\ntemplate <typename\
      \ SampleType>\nclass ProxyEventView\n{\n  public:\n    explicit ProxyEventView(ProxyEvent<SampleType>&\
      \ proxy_event) : proxy_event_{proxy_event} {}\n\n    ProxyEventBinding* GetBinding()\
      \ const noexcept\n    {\n        return proxy_event_.binding_.get();\n    }\n\
      \n  private:\n    ProxyEvent<SampleType>& proxy_event_;\n};\n\n}  // namespace\
