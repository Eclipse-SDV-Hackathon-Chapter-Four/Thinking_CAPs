      \n#include \"score/result/error.h\"\n\n#include <functional>\n#include <sstream>\n\
      #include <utility>\n\nnamespace score::mw::com::test\n{\n\nnamespace detail\n\
      {\n\nvoid FailTest(std::stringstream&& strstr);\n\ntemplate <typename Start,\
      \ typename... Tail>\nvoid FailTest(std::stringstream&& strstr, Start&& start,\
      \ Tail&&... tail)\n{\n    // Since score::result::Error does not have an operator<<\
      \ overload for a stringstream and no method to convert it to\n    // a string,\
      \ we manually stringify it here.\n    if constexpr (std::is_same_v<std::decay_t<Start>,\
      \ score::result::Error>)\n    {\n        strstr << start.Message() << \" / \"\
      \ << start.UserMessage();\n    }\n    else\n    {\n        strstr << std::forward<Start>(start);\n\
      \    }\n\n    if constexpr (sizeof...(Tail) > 0U)\n    {\n        FailTest(std::move(strstr),\
      \ std::forward<Tail>(tail)...);\n    }\n    else\n    {\n        FailTest(std::move(strstr));\n\
      \    }\n}\n\n}  // namespace detail\n\n/// \\brief RAII guard to set a test\
      \ exit function that will be called when FailTest is invoked or when the guard\
      \ is\n/// destroyed.\nclass ExitFunctionGuard\n{\n  public:\n    using ExitFunction\
      \ = std::function<void()>;\n\n    explicit ExitFunctionGuard(ExitFunction exit_function);\n\
      \    ~ExitFunctionGuard();\n\n    ExitFunctionGuard(const ExitFunctionGuard&)\
      \ = delete;\n    ExitFunctionGuard& operator=(const ExitFunctionGuard&) = delete;\n\
      \    ExitFunctionGuard(ExitFunctionGuard&&) = delete;\n    ExitFunctionGuard&\
      \ operator=(ExitFunctionGuard&&) = delete;\n};\n\n/// \\brief Fail a test by\
      \ exiting the program with EXIT_FAILURE and printing a message to stderr.\n\
      /// \\param args variadic number of arguments, each one must be streamable to\
      \ a standard stringstream.\ntemplate <typename... Args>\nvoid FailTest(Args&&...\
      \ args)\n{\n    std::stringstream strstr;\n    strstr << \"\\033[1m\\033[31m\"\
      ;\n    detail::FailTest(std::move(strstr), std::forward<Args>(args)...);\n}\n\
      \n}  // namespace score::mw::com::test\n\n#endif  // SCORE_MW_COM_TEST_COMMON_TEST_RESOURCES_FAIL_TEST_H\n\
