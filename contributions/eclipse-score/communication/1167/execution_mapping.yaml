    purpose: "Implement eclipse-score/communication issue #1167 as a draft C++17 contribution.\n\
      Return ONLY JSON with keys files (array of {path, content}), rationale (string),\
      \ assumptions (array of strings).\nWrite one dedicated integration test under\
      \ score/mw/com/test/api_idempotency/ with an application, configuration,\nBUILD\
      \ targets and the native Python integration harness. Never modify production\
      \ code or existing tests.\nCover OfferService, StopOfferService, StartFindService,\
      \ Subscribe, Unsubscribe.\nEach API must be called repeatedly and checked for\
      \ the native documented behavior, errors and functional state.\nUse real LoLa\
      \ objects and integration macros, not mocked APIs. Include bounded waits and\
      \ explicit failing exits.\nVerify service remains discoverable and usable after\
      \ duplicate offers; discovery absent after repeated stops;\nrepeat StartFindService\
      \ registrations and verify discovery results without incorrectly asserting equal\
      \ registration handles;\nclean up every registration with StopFindService. Duplicate\
      \ Subscribe uses the same sample limit, preserve the subscribed\nstate and prove\
      \ real sample reception; repeated Unsubscribe preserves unsubscribed state and\
      \ re-subscription works.\nRespect asynchronous subscription and discovery; use\
      \ synchronization with finite deadlines rather than arbitrary sleeps.\nUse the\
      \ supplied source examples and their actual public API signatures. Keep configuration\
      \ self-contained and valid.\nPreserve upstream license headers and follow CONTRIBUTING.md.\
      \ Do not claim tests passed, acceptance or issue closure.\nThe only permitted\
      \ new paths are below score/mw/com/test/api_idempotency/. No shell scripts,\
      \ CI changes, fake IDs or approvals.\nIssue text follows:\n### What\n\nFor a\
      \ specific set of public APIs we want calls to be idempotent, i.e. another call\
      \ of this function would not change state and would not cause an error. An example\
      \ for such a call would be OfferService() on as mw::com Skeleton. \n\nGoal of\
      \ this task would be to have one dedicated integration test that ensures that\
      \ all API calls work as expected. (So far this has been included in different\
      \ integration tests.)\n\nThis is the (current) list of  APIs that should be\
      \ covered by this integration test:\n\n- OfferService\n\n- StopOfferService\n\
      \n- StartFindService\n\n- Subscribe\n\n- Unsubscribe\n\n### How\n\nAdd an integration\
      \ test to score/communication. \n\n### Estimates for realization\n\n_No response_\n\
      \n### Category\n\n- [ ] Affects Detailed Design\n\n### Requirements / Architecture\n\
      \n- [x] Requirements / Architecture are not affected by this change?\n\nPinned\
      \ native source context:\n\nFILE CONTRIBUTING.md\n# Contributing\n\n- Thank\
      \ you for your interest in contributing to the Communication Module of the Eclipse\
      \ SCORE project!\n- This guide will walk you through the necessary steps to\
      \ get started with development, adhere to our standards, and successfully submit\
      \ your contributions.\n\n## Eclipse Contributor Agreement (ECA)\n\nBefore making\
      \ any contributions, **you must sign the Eclipse Contributor Agreement (ECA)**.\
      \ This is a mandatory requirement for all contributors to Eclipse projects.\n\
      \nSign the ECA here: https://www.eclipse.org/legal/ECA.php\n\nPull requests\
      \ from contributors who have not signed the ECA **will not be accepted**.\n\n\
      ## Contribution Workflow\n\nTo ensure a smooth contribution process, please\
      \ follow the steps below:\n\n1. **Fork** the repository to your GitHub account.\n\
      2. **Create a feature branch** from your fork:\n   ```bash\n   git checkout\
      \ -b feature/your-feature-name\n   ```\n3. **Write clean and modular code**,\
      \ adhering to:\n   - **C++17 standard**\n   - **Google C++ Style Guide**\n4.\
      \ **Add tests** for any new functionality.\n5. **Ensure all tests pass** before\
      \ submitting:\n   ```bash\n   bazel test //...\n   ```\n6. **Open a Pull Request**\
      \ from your feature branch to the `main` branch of the upstream repository.\n\
      \   - Provide a clear title and description of your changes.\n   - Reference\
      \ any related issues.\n\n## Development Setup\n\n### General Prerequisites\n\
      \n- Bazel (Instructions for installing here: https://bazel.build/install)\n\
      - Docker (Instructions for installing here: https://docs.docker.com/engine/install/)\n\
      \  - Note. Running Docker in rootless mode is not yet officially supported but\
      \ may work. See https://docs.docker.com/engine/security/rootless/ for more information.\n\
      \n### OS-specific Prerequisites\n\nWe strive to be independent of the host platform\
      \ via bazel sandboxing.\nSome host platforms come with limitations that bazel\
      \ cannot sandbox sufficiently.\nFor these platforms we collect instructions\
      \ below.\n\nPlease be aware, that while we officially support Ubuntu 24.04 as\
      \ the host platform that we also test in our CI.\nWhile other platforms generally\
      \ should work, we can give no such guarantee.\nShould you face issues with your\
      \ host platform, feel free to raise an issue or discussion where we will try\
      \ to support.\n\n#### Ubuntu 24.04 and newer\n\nStarting with Ubuntu 24.04 the\
      \ security framework apparmor was introduced.\nThe standard configuration of\
      \ apparmor prohibits unprivileged user namespaces.\nThis interferes with the\
      \ bazel sandboxing mechanism and inhibits the linux-sandbox.\nBazel falls back\
      \ to a less powerful sandboxing mechanism that is insufficient for our project.\n\
      This affects many bazel tests and potentially any bazel runnables.\n\nTo work\
      \ around this issue, you can run a bash script, which you can get by cloning\
      \ the cicd-actions repository\n\n```\ngit clone --depth=1 https://github.com/eclipse-score/cicd-actions\n\
      ```\n\nafter which you can run\n\n```bash\nbash <path to cicd-actions repository>/unblock_user_namespace_for_linux_sandbox/action_callable.sh\n\
      ```\n\nNote. To take this into effect force, a bazel restart by shutting it\
      \ down 1st\n\n```bash\nbazel shutdown\n```\n\nThese steps must be rerun whenever\
      \ the bazel version is updated.\n\n### Build Instructions\n\nTo build and test\
      \ the Communication Module, follow the steps below from the project root:\n\n\
      ```bash\n# Build all targets\nbazel build //...\n\n# Run all tests\nbazel test\
      \ //...\n```\n\n### Optional: Configure a local Ubuntu snapshot mirror\n\nThe\
      \ Ubuntu snapshot mirrors are sometimes unreliable. See: https://answers.launchpad.net/launchpad/+question/824541\n\
      \nIf you have access to a more reliable Ubuntu snapshot mirror, you can make\
      \ Bazel try it first while keeping\nthe public `snapshot.ubuntu.com` URL as\
      \ fallback.\n\nAn example for such a snapshot mirror service is https://stablebuild.com\n\
      \n1. Create a local downloader config at `user.downloader_config` (this file\
      \ is ignored by git).\n   Replace the `<private-mirror-tag>` with the tag provided\
      \ by the StableBuild API\n\n```text\nrewrite snapshot.ubuntu.com/ubuntu/[^/]*/(.*)\
      \ <private-mirror-tag>.debmirror.stablebuild.com/2026-04-01T10:40:01Z/archive.ubuntu.com/ubuntu/$1\n\
      rewrite snapshot.ubuntu.com/ubuntu/[^/]*/(.*) <private-mirror-tag>.debmirror.stablebuild.com/2026-04-01T10:40:01Z/ports.ubuntu.com/$1\n\
      rewrite snapshot.ubuntu.com/ubuntu/(.*) snapshot.ubuntu.com/ubuntu/$1\n```\n\
      \n2. Point Bazel to this local config in `user.bazelrc` (also ignored by git):\n\
      \n```text\ncommon --downloader_config=user.downloader_config\n```\n\n3. Restart\
      \ the Bazel server to reload the downloader config\n\n```shell\nbazel shutdown\n\
      ```\n\n### Linting Instructions\n\nFor Linting the Code following solutions\
      \ are available:\n\nCopyright Checker:\n```bash\n# Check Sources\nbazel run\
      \ //:copyright.check\n\n# Fix Sources\nbazel run //:copyright.fix\n```\n\nC++\
      \ and Bazel files formatter:\n```bash\n# Check Sources\nbazel run //:format.check\n\
      \n# Fix Sources\nbazel run //:format\n```\n\n### Testing Instructions\n\nThe\
      \ Communication Module includes extensive tests. Use the following commands:\n\
      \n#### Run All Tests\n```bash\nbazel test //...\n```\n\n#### Run Specific Test\
      \ Suites\n```bash\nbazel test //score/mw/com/impl:all\nbazel test //score/mw/com/message_passing:all\n\
      ```\n\n#### Test Categories\n- **Unit Tests**: Component-level testing\n- **Integration\
      \ Tests**: Cross-component interactions\n- **Performance Tests**: Latency and\
      \ throughput benchmarks\n- **Safety Tests**: ASIL-B compliance verification\n\
      \n## Additional Resources\n\nFor project details, documentation, and support\
      \ resources, please refer to the main [README.md](README.md).\nFor the release\
      \ process, see [RELEASING.md](RELEASING.md).\n\n---\n\n## How to Document\n\n\
      This section explains how to document C++ code so it appears in the generated\
      \ API documentation.\n\n> API documentation is generated using Doxygen and integrated\
      \ via Breathe.\n> Due to Sphinx version < 9.x limitations with complex C++ templates,\
      \ use specific class\n> and function directives rather than namespace-level\
      \ documentation.\n\n### Automatic API Documentation with @api Tag\n\nThe project\
      \ includes an automated RST generation utility that extracts items\ntagged with\
      \ `@api` in Doxygen comments and generates categorized documentation.\n\nAdd\
      \ the `@api` tag to any Doxygen comment block to include it in the generated\
      \ API documentation:\n\n```cpp\n/**\n * @brief Connection handler for client\
      \ communication\n * @api\n */\nclass ClientConnection {\n    // ...\n};\n\n\
      /**\n * @brief Initialize the communication system\n * @return true if successful\n\
      \ * @api\n */\nbool initialize();\n```\n\nThe utility automatically creates:\n\
      \n- **API Index** \u2014 overview of all tagged items\n- **Namespace Reference**\
      \ \u2014 namespaces containing `@api` items\n- **Class Reference** \u2014 classes\
      \ and structs with `@api` tag\n- **Member Reference** \u2014 functions and methods\
      \ with `@api` tag\n\nBuild integration:\n\n```starlark\ngenerate_api_rst(\n\
      \    name = \"generate_api_rst\",\n    doxygen_xml = \"//path/to:doxygen_target\"\
      ,\n    output_dir = \"generated\",\n    project_name = \"mw::com\",\n)\n```\n\
      \nThe generated RST files are automatically included in the Sphinx documentation\n\
      under the \"Generated API Documentation\" section.\n\n### Using Breathe Directives\n\
      \nTo document specific classes or functions, use these Breathe directives in\
      \ RST files:\n\n**Document a specific class:**\n\n```rst\n.. doxygenclass::\
      \ score::message_passing::detail::ClientConnection\n    :members:\n    :protected-members:\n\
      \    :undoc-members:\n```\n\n**Document a specific function:**\n\n```rst\n..\
      \ doxygenfunction:: score::mw::com::functionName\n```\n\n**Document a struct:**\n\
      \n```rst\n.. doxygenstruct:: score::mw::com::ConfigStruct\n    :members:\n```\n\
      \n### Further Resources\n\n- Browse the Doxygen-generated HTML at `bazel-bin/score/mw/com/design/doxygen_build/html/index.html`\n\
      - Review header files in `score/mw/com/` for inline documentation\n- Check the\
      \ design documentation at `score/mw/com/design/`\n\n**Thank you for contributing\
      \ to the Eclipse SCORE Communication Module!**\n\n\nFILE score/mw/com/impl/proxy_base.h\n\
