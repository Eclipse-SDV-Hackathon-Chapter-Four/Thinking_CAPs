[package]
name = "sdv-lighting-diagnostics"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
opensovd-core = { git = "https://github.com/eclipse-opensovd/opensovd-core", rev = "e25fa30d1bdcb6726e3b4c4ec5d683b783e7c1af" }
opensovd-models = { git = "https://github.com/eclipse-opensovd/opensovd-core", rev = "e25fa30d1bdcb6726e3b4c4ec5d683b783e7c1af", features = ["jsonschema"] }
opensovd-providers = { git = "https://github.com/eclipse-opensovd/opensovd-core", rev = "e25fa30d1bdcb6726e3b4c4ec5d683b783e7c1af" }
opensovd-server = { git = "https://github.com/eclipse-opensovd/opensovd-core", rev = "e25fa30d1bdcb6726e3b4c4ec5d683b783e7c1af" }
async-trait = "0.1"
serde_json = "1"
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
