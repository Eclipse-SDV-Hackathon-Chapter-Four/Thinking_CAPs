[package]
name = "sdv-receiver-diagnostics"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
fault-lifecycle = ["dep:score-fault-common", "dep:fault_lib", "dep:dfm_lib", "dep:sha2", "dep:iceoryx2-bb-posix"]

[dependencies]
opensovd-core = { git = "https://github.com/eclipse-opensovd/opensovd-core", rev = "e25fa30d1bdcb6726e3b4c4ec5d683b783e7c1af" }
opensovd-models = { git = "https://github.com/eclipse-opensovd/opensovd-core", rev = "e25fa30d1bdcb6726e3b4c4ec5d683b783e7c1af", features = ["jsonschema"] }
opensovd-providers = { git = "https://github.com/eclipse-opensovd/opensovd-core", rev = "e25fa30d1bdcb6726e3b4c4ec5d683b783e7c1af" }
opensovd-server = { git = "https://github.com/eclipse-opensovd/opensovd-core", rev = "e25fa30d1bdcb6726e3b4c4ec5d683b783e7c1af" }
async-trait = "0.1"
libc = "0.2"
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
score-fault-common = { package = "common", git = "https://github.com/eclipse-opensovd/fault-lib.git", rev = "12dac502616701734f90a61edca1326ae2ac6506", optional = true }
fault_lib = { git = "https://github.com/eclipse-opensovd/fault-lib.git", rev = "12dac502616701734f90a61edca1326ae2ac6506", optional = true }
dfm_lib = { git = "https://github.com/eclipse-opensovd/fault-lib.git", rev = "12dac502616701734f90a61edca1326ae2ac6506", optional = true }
sha2 = { version = "0.10", optional = true }
iceoryx2-bb-posix = { git = "https://github.com/eclipse-iceoryx/iceoryx2.git", rev = "eba5da4b8d8cb03bccf1394d88a05e31f58838dc", optional = true }
